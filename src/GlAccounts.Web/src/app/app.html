<a class="skip-link" href="#main">Skip to main content</a>

<mat-toolbar class="app-toolbar">
  <span class="app-title">GL Accounts</span>
  <nav aria-label="Main">
    <a mat-button routerLink="/gl/accounts" routerLinkActive="active" ariaCurrentWhenActive="page">Accounts</a>
    <a mat-button routerLink="/gl/account-templates" routerLinkActive="active" ariaCurrentWhenActive="page">Templates</a>
  </nav>
</mat-toolbar>

<main id="main" tabindex="-1">
  <router-outlet />
</main>

<!-- Live regions: polite for success and result counts, assertive for failures (user-flows.md). -->
<div class="visually-hidden" role="status" aria-live="polite" aria-atomic="true">{{ announcer.polite() }}</div>
<div class="visually-hidden" role="alert" aria-live="assertive" aria-atomic="true">{{ announcer.assertive() }}</div>
