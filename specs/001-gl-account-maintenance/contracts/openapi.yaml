openapi: "3.1.0"
info:
  title: GL Account Maintenance and Inquiry API
  version: "1.0.0"
  description: |
    REST API for the General Ledger Account Maintenance and Inquiry feature.
    Covers GL account lifecycle (create, read, update, delete), account attributes,
    period summary, transaction history, account group membership, audit trail,
    and template-based account creation.

    **Phase note**: This phase uses stub (in-memory) data only. No database or ORM.
    Authorization enforcement is deferred to a future phase; all callers are trusted.
    The `X-User-Id` header is accepted for audit logging only.

servers:
  - url: https://localhost:5001
    description: Local development (stub data)

security:
  - userIdHeader: []

components:
  securitySchemes:
    userIdHeader:
      type: apiKey
      in: header
      name: X-User-Id
      description: >
        Caller-supplied user identity used for audit logging only.
        Authorization is not enforced in this phase.

  schemas:
    # ── Enums ──────────────────────────────────────────────────────────────────
    AccountType:
      type: string
      enum: [Financial, Statistical]
      description: Financial = monetary; Statistical = non-monetary. Permanent after creation.

    AccountStatus:
      type: string
      enum: [Active, Hold, Inactive, Template]
      description: >
        Active = fully available; Hold = no new transactions;
        Inactive = cannot be used in transactions; Template = model only.

    BalanceType:
      type: string
      enum: [BalanceForward, Periodic]

    NormalBalance:
      type: string
      enum: [Debit, Credit]

    ChangeType:
      type: string
      enum: [Created, Updated, Deleted]

    # ── Account ────────────────────────────────────────────────────────────────
    CreateAccountRequest:
      type: object
      required:
        - accountId
        - description
        - accountType
        - category
        - status
        - balanceType
        - normalBalance
      properties:
        accountId:
          type: string
          maxLength: 32
          description: Must be unique and match the active segment format (e.g. 01-100-1000).
          example: "01-300-1000"
        description:
          type: string
          maxLength: 200
          example: "New Cost Centre Account"
        accountType:
          $ref: "#/components/schemas/AccountType"
        category:
          type: string
          maxLength: 50
          description: Must be valid for the chosen AccountType.
          example: "Asset"
        status:
          $ref: "#/components/schemas/AccountStatus"
        balanceType:
          $ref: "#/components/schemas/BalanceType"
        normalBalance:
          $ref: "#/components/schemas/NormalBalance"
        currencyId:
          type: string
          maxLength: 10
          description: Optional. Stored as-is; no currency master validation in this phase.
          example: "USD"

    UpdateAccountRequest:
      type: object
      description: >
        Only editable fields are accepted. AccountId and AccountType are ignored even if supplied;
        a request that explicitly attempts to change them returns 422.
      properties:
        description:
          type: string
          maxLength: 200
          example: "Updated description"
        category:
          type: string
          maxLength: 50
          example: "Asset"
        status:
          $ref: "#/components/schemas/AccountStatus"
        balanceType:
          $ref: "#/components/schemas/BalanceType"
        normalBalance:
          $ref: "#/components/schemas/NormalBalance"
        currencyId:
          type: string
          maxLength: 10
          example: "USD"

    AccountResponse:
      type: object
      required:
        - accountId
        - description
        - accountType
        - category
        - status
        - balanceType
        - normalBalance
        - createdDate
        - createdBy
      properties:
        accountId:
          type: string
          example: "01-100-1000"
        description:
          type: string
          example: "Cash Account"
        accountType:
          $ref: "#/components/schemas/AccountType"
        category:
          type: string
          example: "Asset"
        status:
          $ref: "#/components/schemas/AccountStatus"
        balanceType:
          $ref: "#/components/schemas/BalanceType"
        normalBalance:
          $ref: "#/components/schemas/NormalBalance"
        currencyId:
          type: string
          nullable: true
          example: "USD"
        createdDate:
          type: string
          format: date
          example: "2026-01-15"
        createdBy:
          type: string
          example: "admin-user"

    # ── Attributes ─────────────────────────────────────────────────────────────
    AddAttributeRequest:
      type: object
      required:
        - attributeTypeId
        - attributeValueId
      properties:
        attributeTypeId:
          type: string
          maxLength: 50
          example: "REPORTING_UNIT"
        attributeValueId:
          type: string
          maxLength: 50
          example: "NORTH_REGION"

    UpdateAttributeRequest:
      type: object
      required:
        - attributeValueId
      properties:
        attributeValueId:
          type: string
          maxLength: 50
          example: "SOUTH_REGION"

    AttributeResponse:
      type: object
      required:
        - attributeId
        - accountId
        - attributeTypeId
        - attributeTypeDescription
        - attributeValueId
        - attributeValueDescription
      properties:
        attributeId:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        accountId:
          type: string
          example: "01-100-1000"
        attributeTypeId:
          type: string
          example: "REPORTING_UNIT"
        attributeTypeDescription:
          type: string
          example: "Reporting Unit"
        attributeValueId:
          type: string
          example: "NORTH_REGION"
        attributeValueDescription:
          type: string
          example: "North Region"

    # ── Account Groups ─────────────────────────────────────────────────────────
    AccountGroupResponse:
      type: object
      required:
        - groupId
        - groupName
      properties:
        groupId:
          type: string
          example: "GRP-001"
        groupName:
          type: string
          example: "Current Assets"
        description:
          type: string
          nullable: true
          example: "All current asset accounts"

    AccountGroupListResponse:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AccountGroupResponse"
        total:
          type: integer
          example: 2

    # ── Period Summary ─────────────────────────────────────────────────────────
    PeriodBalanceResponse:
      type: object
      required:
        - balanceId
        - accountId
        - fiscalYear
        - fiscalPeriod
        - balance
      properties:
        balanceId:
          type: string
          format: uuid
          example: "b1b2c3d4-e5f6-7890-abcd-ef1234567890"
        accountId:
          type: string
          example: "01-100-1000"
        fiscalYear:
          type: integer
          example: 2026
        fiscalPeriod:
          type: integer
          minimum: 1
          maximum: 13
          example: 1
        budgetVersion:
          type: string
          nullable: true
          example: "ORIGINAL"
        balance:
          type: number
          format: decimal
          example: 125000.00

    PeriodSummaryResponse:
      type: object
      required:
        - accountId
        - items
        - total
      properties:
        accountId:
          type: string
          example: "01-100-1000"
        items:
          type: array
          items:
            $ref: "#/components/schemas/PeriodBalanceResponse"
        total:
          type: integer
          example: 4

    # ── Transactions ───────────────────────────────────────────────────────────
    TransactionResponse:
      type: object
      required:
        - transactionId
        - accountId
        - batchId
        - description
        - amount
        - postingDate
        - postingStatus
      properties:
        transactionId:
          type: string
          example: "TXN-001"
        accountId:
          type: string
          example: "01-200-2000"
        batchId:
          type: string
          example: "BATCH-2026-001"
        description:
          type: string
          example: "Opening entry"
        amount:
          type: number
          format: decimal
          example: 5000.00
        postingDate:
          type: string
          format: date
          example: "2026-01-01"
        postingStatus:
          type: string
          enum: [Posted, Unposted]
          example: "Posted"

    TransactionListResponse:
      type: object
      required:
        - accountId
        - items
        - total
      properties:
        accountId:
          type: string
          example: "01-200-2000"
        items:
          type: array
          items:
            $ref: "#/components/schemas/TransactionResponse"
        total:
          type: integer
          example: 3

    # ── Template Copy ──────────────────────────────────────────────────────────
    CopyFromTemplateRequest:
      type: object
      required:
        - newAccountId
        - description
      properties:
        newAccountId:
          type: string
          maxLength: 32
          description: Must be unique and match the active segment format.
          example: "01-100-9000"
        description:
          type: string
          maxLength: 200
          example: "Copy of Template Account"

    # ── Shared Error ───────────────────────────────────────────────────────────
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          example: "https://tools.ietf.org/html/rfc9110#section-15.5.1"
        title:
          type: string
          example: "Bad Request"
        status:
          type: integer
          example: 400
        detail:
          type: string
          nullable: true
          example: "One or more validation errors occurred."
        instance:
          type: string
          nullable: true
          example: "/api/gl/accounts"

    ValidationProblemDetails:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
              example:
                accountId: ["Account ID 'INVALID' does not match segment format. Expected format: NN-NNN-NNNN"]

paths:
  # ── Accounts ───────────────────────────────────────────────────────────────
  /api/gl/accounts:
    post:
      operationId: createAccount
      summary: Create a new GL account
      description: >
        Creates a GL account with a validated, unique account ID built from segment values.
        AccountType becomes permanent after creation.
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
            examples:
              valid:
                summary: Valid new account
                value:
                  accountId: "01-300-1000"
                  description: "New Cost Centre"
                  accountType: "Financial"
                  category: "Asset"
                  status: "Active"
                  balanceType: "BalanceForward"
                  normalBalance: "Debit"
                  currencyId: "USD"
      responses:
        "201":
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
              examples:
                created:
                  summary: Created account
                  value:
                    accountId: "01-300-1000"
                    description: "New Cost Centre"
                    accountType: "Financial"
                    category: "Asset"
                    status: "Active"
                    balanceType: "BalanceForward"
                    normalBalance: "Debit"
                    currencyId: "USD"
                    createdDate: "2026-10-16"
                    createdBy: "test-user"
        "400":
          description: Validation error (missing or malformed fields)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
              examples:
                missing_field:
                  summary: Missing required field
                  value:
                    type: "https://tools.ietf.org/html/rfc9110#section-15.5.1"
                    title: "One or more validation errors occurred."
                    status: 400
                    errors:
                      description: ["The Description field is required."]
        "409":
          description: Duplicate account ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                duplicate:
                  summary: Duplicate account ID
                  value:
                    type: "https://tools.ietf.org/html/rfc9110#section-15.5.9"
                    title: "Conflict"
                    status: 409
                    detail: "Account ID '01-300-1000' already exists. Please use a unique ID."
        "422":
          description: Semantic validation error (invalid segment format, invalid category for type)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
              examples:
                bad_format:
                  summary: Segment format mismatch
                  value:
                    type: "https://tools.ietf.org/html/rfc9110#section-15.5.1"
                    title: "Unprocessable Entity"
                    status: 422
                    errors:
                      accountId: ["Account ID does not match segment format. Expected format: NN-NNN-NNNN"]
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/gl/accounts/{accountId}:
    parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
        description: The GL account ID (e.g. 01-100-1000)
        example: "01-100-1000"

    get:
      operationId: getAccount
      summary: Retrieve a GL account by ID
      tags: [Accounts]
      responses:
        "200":
          description: Account found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
              examples:
                found:
                  summary: Cash account
                  value:
                    accountId: "01-100-1000"
                    description: "Cash Account"
                    accountType: "Financial"
                    category: "Asset"
                    status: "Active"
                    balanceType: "BalanceForward"
                    normalBalance: "Debit"
                    currencyId: "USD"
                    createdDate: "2026-01-01"
                    createdBy: "admin"
        "400":
          description: Invalid account ID format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                not_found:
                  summary: Account not found
                  value:
                    type: "https://tools.ietf.org/html/rfc9110#section-15.5.5"
                    title: "Not Found"
                    status: 404
                    detail: "Account '99-999-9999' not found."
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

    put:
      operationId: updateAccount
      summary: Update editable fields of a GL account
      description: >
        Updates editable fields (Description, Category, Status, BalanceType, NormalBalance, CurrencyId).
        AccountId and AccountType are permanent; requests that attempt to change them return 422.
        Last-write-wins; no ETag/If-Match in this phase.
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountRequest"
            examples:
              update_desc:
                summary: Update description
                value:
                  description: "Updated Cash Account"
      responses:
        "200":
          description: Account updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
              examples:
                updated:
                  summary: Updated account
                  value:
                    accountId: "01-100-1000"
                    description: "Updated Cash Account"
                    accountType: "Financial"
                    category: "Asset"
                    status: "Active"
                    balanceType: "BalanceForward"
                    normalBalance: "Debit"
                    currencyId: "USD"
                    createdDate: "2026-01-01"
                    createdBy: "admin"
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: Attempt to change permanent field or invalid category for account type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
              examples:
                permanent_field:
                  summary: Permanent field change rejected
                  value:
                    type: "https://tools.ietf.org/html/rfc9110#section-15.5.1"
                    title: "Unprocessable Entity"
                    status: 422
                    errors:
                      accountType: ["AccountType cannot be changed after creation."]
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

    delete:
      operationId: deleteAccount
      summary: Delete a GL account
      description: >
        Deletes the account only if no dependencies exist (posted transactions,
        unposted transactions, budgets, allocations, or account group membership).
        Returns 409 with dependency detail when blocked; suggests deactivation.
      tags: [Accounts]
      responses:
        "204":
          description: Account deleted successfully
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: Deletion blocked due to existing dependencies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
              examples:
                has_transactions:
                  summary: Account has posted transactions
                  value:
                    type: "https://tools.ietf.org/html/rfc9110#section-15.5.10"
                    title: "Conflict"
                    status: 409
                    detail: "Cannot delete account '01-200-2000'. It has 3 posted transaction(s). Consider deactivating the account instead."
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  # ── Attributes ─────────────────────────────────────────────────────────────
  /api/gl/accounts/{accountId}/attributes:
    parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
        example: "01-100-1000"

    post:
      operationId: addAccountAttribute
      summary: Assign an attribute to a GL account
      tags: [Attributes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddAttributeRequest"
            examples:
              add:
                summary: Assign reporting unit
                value:
                  attributeTypeId: "REPORTING_UNIT"
                  attributeValueId: "NORTH_REGION"
      responses:
        "201":
          description: Attribute assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeResponse"
              examples:
                created:
                  summary: Created attribute
                  value:
                    attributeId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    accountId: "01-100-1000"
                    attributeTypeId: "REPORTING_UNIT"
                    attributeTypeDescription: "Reporting Unit"
                    attributeValueId: "NORTH_REGION"
                    attributeValueDescription: "North Region"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: Attribute type or value not found in catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /api/gl/accounts/{accountId}/attributes/{attributeId}:
    parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
        example: "01-100-1000"
      - name: attributeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"

    put:
      operationId: updateAccountAttribute
      summary: Update an account attribute value
      tags: [Attributes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAttributeRequest"
            examples:
              update:
                summary: Change region
                value:
                  attributeValueId: "SOUTH_REGION"
      responses:
        "200":
          description: Attribute updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeResponse"
              examples:
                updated:
                  summary: Updated attribute
                  value:
                    attributeId: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    accountId: "01-100-1000"
                    attributeTypeId: "REPORTING_UNIT"
                    attributeTypeDescription: "Reporting Unit"
                    attributeValueId: "SOUTH_REGION"
                    attributeValueDescription: "South Region"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Account or attribute not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: Attribute value not found in catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

    delete:
      operationId: removeAccountAttribute
      summary: Remove an attribute from a GL account
      tags: [Attributes]
      responses:
        "204":
          description: Attribute removed
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Account or attribute not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  # ── Account Groups ──────────────────────────────────────────────────────────
  /api/gl/accounts/{accountId}/groups:
    parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
        example: "01-100-1000"

    get:
      operationId: listAccountGroups
      summary: List all account groups that contain a given account
      tags: [AccountGroups]
      responses:
        "200":
          description: Groups returned (empty list if none)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountGroupListResponse"
              examples:
                two_groups:
                  summary: Account in two groups
                  value:
                    items:
                      - groupId: "GRP-001"
                        groupName: "Current Assets"
                        description: "All current asset accounts"
                      - groupId: "GRP-002"
                        groupName: "Cash Equivalents"
                        description: null
                    total: 2
        "400":
          description: Invalid account ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  # ── Period Summary ──────────────────────────────────────────────────────────
  /api/gl/accounts/{accountId}/period-summary:
    parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
        example: "01-100-1000"
      - name: fiscalYear
        in: query
        required: false
        schema:
          type: integer
        description: Filter by fiscal year (e.g. 2026)
        example: 2026
      - name: fromPeriod
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 13
        description: Filter from fiscal period (inclusive)
        example: 1
      - name: toPeriod
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 13
        description: Filter to fiscal period (inclusive)
        example: 4

    get:
      operationId: getAccountPeriodSummary
      summary: Retrieve period-level balance data for an account
      tags: [PeriodSummary]
      responses:
        "200":
          description: Period summary returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PeriodSummaryResponse"
              examples:
                fy2026:
                  summary: FY2026 periods 1-4
                  value:
                    accountId: "01-100-1000"
                    items:
                      - balanceId: "b1b2c3d4-e5f6-7890-abcd-ef1234567890"
                        accountId: "01-100-1000"
                        fiscalYear: 2026
                        fiscalPeriod: 1
                        budgetVersion: "ORIGINAL"
                        balance: 125000.00
                      - balanceId: "b2b2c3d4-e5f6-7890-abcd-ef1234567890"
                        accountId: "01-100-1000"
                        fiscalYear: 2026
                        fiscalPeriod: 2
                        budgetVersion: "ORIGINAL"
                        balance: 130000.00
                    total: 4
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  # ── Transactions ────────────────────────────────────────────────────────────
  /api/gl/accounts/{accountId}/transactions:
    parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
        example: "01-200-2000"
      - name: fromDate
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Filter transactions from this date (inclusive, ISO 8601)
        example: "2026-01-01"
      - name: toDate
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Filter transactions to this date (inclusive, ISO 8601)
        example: "2026-12-31"
      - name: postingStatus
        in: query
        required: false
        schema:
          type: string
          enum: [Posted, Unposted]
        description: Filter by posting status

    get:
      operationId: getAccountTransactions
      summary: Retrieve posted transaction history for an account
      tags: [Transactions]
      responses:
        "200":
          description: Transactions returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionListResponse"
              examples:
                three_txns:
                  summary: Three posted transactions
                  value:
                    accountId: "01-200-2000"
                    items:
                      - transactionId: "TXN-001"
                        accountId: "01-200-2000"
                        batchId: "BATCH-2026-001"
                        description: "Opening entry"
                        amount: 5000.00
                        postingDate: "2026-01-01"
                        postingStatus: "Posted"
                      - transactionId: "TXN-002"
                        accountId: "01-200-2000"
                        batchId: "BATCH-2026-001"
                        description: "Monthly accrual"
                        amount: 1500.00
                        postingDate: "2026-01-31"
                        postingStatus: "Posted"
                      - transactionId: "TXN-003"
                        accountId: "01-200-2000"
                        batchId: "BATCH-2026-002"
                        description: "Correction entry"
                        amount: -200.00
                        postingDate: "2026-02-15"
                        postingStatus: "Posted"
                    total: 3
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  # ── Template Copy ───────────────────────────────────────────────────────────
  /api/gl/accounts/{accountId}/copy:
    parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
        description: The source template account ID
        example: "01-100-5000"

    post:
      operationId: copyAccountFromTemplate
      summary: Create a new account by copying settings from a template account
      description: >
        The source account must have status = Template.
        The new account's ID must be unique and match the segment format.
        All classification settings are copied; the new account is created with status = Active.
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyFromTemplateRequest"
            examples:
              copy:
                summary: Copy template
                value:
                  newAccountId: "01-100-9000"
                  description: "Copy of Template Account"
      responses:
        "201":
          description: Account created from template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
              examples:
                copied:
                  summary: New account from template
                  value:
                    accountId: "01-100-9000"
                    description: "Copy of Template Account"
                    accountType: "Financial"
                    category: "Asset"
                    status: "Active"
                    balanceType: "BalanceForward"
                    normalBalance: "Debit"
                    currencyId: null
                    createdDate: "2026-10-16"
                    createdBy: "test-user"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
        "404":
          description: Source account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "409":
          description: New account ID already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: Source account is not a Template, or new ID fails segment validation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
              examples:
                not_template:
                  summary: Source not a template
                  value:
                    type: "https://tools.ietf.org/html/rfc9110#section-15.5.1"
                    title: "Unprocessable Entity"
                    status: 422
                    errors:
                      accountId: ["Account '01-100-1000' is not a Template account and cannot be used as a copy source."]
        "500":
          description: Unexpected server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
